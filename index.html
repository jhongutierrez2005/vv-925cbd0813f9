<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="theme-color" content="#120810">
<meta property="og:title" content="Universo Vania Valeria">
<meta name="description" content="Un universo de flores rosadas.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Universo Vania Valeria</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap">
<style>
  :root{
    --noche:#120810;
    --ciruela:#1d0d19;
    --rosa:#ff74b1;
    --rosa-hondo:#c92a6e;
    --rosa-claro:#ffc2de;
    --nacar:#fbeef4;
    --papel:#fdf4f1;
    --tinta:#3b1c2b;
    --tinta-suave:#7a5666;
    --verde:#6f7d41;

    --t-display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
    --t-mano:"Pinyon Script", "Cormorant Garamond", cursive;
    --t-util:"Jost", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--noche);color:var(--nacar);
    font-family:var(--t-util);font-weight:300;
    overflow:hidden;-webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit}

  /* ============ ESCENA ============ */
  #cosmos{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
  #cosmos.arrastrando{cursor:grabbing}
  #cosmos.sobre-flor{cursor:pointer}

  /* viñeta + grano: lo que convierte un render en una fotografía */
  .atmosfera{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(120% 82% at 50% 46%, transparent 38%, rgba(10,4,9,.55) 78%, rgba(8,3,7,.88) 100%);
  }
  .grano{
    position:fixed;inset:-50%;z-index:1;pointer-events:none;opacity:.24;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='r'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23r)' opacity='.55'/></svg>");
  }
  @media (prefers-reduced-motion:no-preference){
    .grano{animation:tiembla 1.1s steps(3) infinite}
    @keyframes tiembla{
      0%{transform:translate(0,0)} 33%{transform:translate(-2%,1%)} 66%{transform:translate(1%,-2%)} 100%{transform:translate(0,0)}
    }
  }

  /* ============ OBERTURA ============ */
  .velo{
    position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:0;text-align:center;
    padding:32px 22px;
    background:radial-gradient(90% 70% at 50% 42%, #24101f 0%, #120810 62%, #0b050a 100%);
    transition:opacity 1.1s ease, visibility 1.1s;
  }
  .velo.fuera{opacity:0;visibility:hidden}
  .velo .para{
    font-family:var(--t-util);font-size:.6rem;font-weight:400;
    letter-spacing:.46em;text-transform:uppercase;color:var(--rosa);
    margin:0 0 26px;opacity:0;animation:surge 1.1s .25s ease-out forwards;
  }
  .velo .firma-nombre{
    font-family:var(--t-mano);font-size:clamp(3.6rem,15vw,7rem);line-height:.9;
    margin:0;color:var(--rosa-claro);font-weight:400;
    text-shadow:0 0 60px rgba(255,116,177,.38);
    opacity:0;animation:surge 1.4s .5s ease-out forwards;
  }
  .velo .sub{
    font-family:var(--t-display);font-style:italic;font-size:clamp(1rem,4vw,1.24rem);
    color:#e9cfdc;margin:18px 0 0;max-width:26ch;
    opacity:0;animation:surge 1.4s .9s ease-out forwards;
  }
  .abrir{
    margin-top:42px;background:none;cursor:pointer;
    border:1px solid rgba(255,116,177,.42);
    padding:15px 34px;border-radius:999px;
    font-family:var(--t-util);font-size:.62rem;font-weight:400;
    letter-spacing:.34em;text-transform:uppercase;color:var(--rosa-claro);
    opacity:0;animation:surge 1.2s 1.35s ease-out forwards;
    transition:background .35s ease, border-color .35s ease, color .35s ease;
  }
  .abrir:hover,.abrir:focus-visible{background:rgba(255,116,177,.14);border-color:var(--rosa);color:#fff}
  @keyframes surge{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ============ HUD ============ */
  .hud{
    position:fixed;inset:0;z-index:4;pointer-events:none;
    display:grid;grid-template-rows:auto 1fr auto;
    padding:0 clamp(18px,5vw,44px);
    padding-top:calc(30px + env(safe-area-inset-top,0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
    opacity:0;transition:opacity 1.4s ease .5s;
  }
  .hud.dentro{opacity:1}
  .scrim{position:fixed;left:0;right:0;z-index:3;pointer-events:none;height:30vh}
  .scrim.arriba{top:0;background:linear-gradient(180deg, rgba(10,4,9,.82), transparent)}
  .scrim.abajo{bottom:0;background:linear-gradient(0deg, rgba(10,4,9,.88), transparent)}

  /* cabecera: asimétrica, no todo centrado */
  .cabecera{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
  .ocasion{
    font-size:.56rem;font-weight:400;letter-spacing:.34em;text-transform:uppercase;
    color:var(--rosa);margin:0;max-width:11ch;line-height:2.1;text-align:left;
  }
  .titulo{text-align:right}
  .titulo .nombre{
    font-family:var(--t-mano);font-weight:400;
    font-size:clamp(2.6rem,9vw,4.6rem);line-height:.9;margin:0;
    color:var(--rosa-claro);text-shadow:0 0 44px rgba(255,116,177,.4);
  }
  .titulo .apellido{
    font-family:var(--t-display);font-size:clamp(.6rem,2.4vw,.74rem);
    letter-spacing:.5em;text-transform:uppercase;color:#e3c6d5;margin:10px 0 0;
    padding-right:.5em;
  }

  /* pie: cifras grabadas + índice de etapas */
  .pie-hud{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3vh,24px)}
  .cifras{display:flex;align-items:center;gap:clamp(22px,7vw,52px)}
  .cifra-bloque{text-align:center}
  .cifra{
    display:block;font-family:var(--t-display);font-weight:300;
    font-size:clamp(2.6rem,10vw,3.9rem);line-height:.9;color:var(--nacar);
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  .cifra-bloque .etiqueta-cifra{
    display:block;font-size:.52rem;font-weight:400;letter-spacing:.3em;text-transform:uppercase;
    color:#d6b4c6;margin-top:12px;
  }
  .filete{width:34px;height:1px;background:rgba(255,194,222,.45);margin:10px auto 0}
  .rombo{width:5px;height:5px;background:var(--rosa);transform:rotate(45deg);opacity:.8;flex:0 0 auto}

  .indice{display:flex;gap:10px;pointer-events:auto;padding:0;margin:0;list-style:none}
  .indice button{
    background:none;border:0;padding:8px 4px;cursor:pointer;display:block;
  }
  .indice .punto{
    display:block;width:9px;height:9px;border:1px solid rgba(255,194,222,.5);
    transform:rotate(45deg);transition:background .4s ease, border-color .4s ease, transform .4s ease;
  }
  .indice button[aria-pressed="true"] .punto{background:var(--rosa);border-color:var(--rosa);transform:rotate(45deg) scale(1.25)}
  .indice button:focus-visible .punto{outline:1px solid var(--rosa-claro);outline-offset:4px}

  .pista{
    font-size:.54rem;font-weight:300;letter-spacing:.26em;text-transform:uppercase;
    color:#a98a9b;margin:0;text-align:center;
  }
  .pista b{color:var(--rosa-claro);font-weight:400}

  .carta-cta{
    pointer-events:auto;background:none;border:0;cursor:pointer;
    font-family:var(--t-mano);font-size:1.7rem;color:var(--rosa-claro);
    padding:2px 10px;line-height:1.1;text-shadow:0 0 26px rgba(255,116,177,.4);
    transition:color .3s ease;
  }
  .carta-cta:hover{color:#fff}

  /* ============ ETIQUETAS 3D ============ */
  .etiqueta{
    position:fixed;z-index:5;transform:translate(-50%,-50%);
    pointer-events:auto;cursor:pointer;background:none;border:0;padding:10px 12px;
    font-family:var(--t-display);font-style:italic;font-size:.92rem;letter-spacing:.02em;
    color:var(--nacar);white-space:nowrap;text-shadow:0 2px 18px rgba(0,0,0,.9);
    opacity:0;transition:opacity .4s ease, color .3s ease;
  }
  .etiqueta .anio{
    display:block;font-family:var(--t-util);font-style:normal;
    font-size:.5rem;font-weight:400;letter-spacing:.28em;text-transform:uppercase;
    color:var(--rosa);margin-top:5px;
  }
  .etiqueta::after{
    content:"";display:block;width:0;height:1px;background:var(--rosa-claro);
    margin:7px auto 0;transition:width .45s cubic-bezier(.2,.7,.3,1);
  }
  .etiqueta:hover::after,.etiqueta:focus-visible::after{width:100%}
  .etiqueta:hover,.etiqueta:focus-visible{color:#fff}
  .etiqueta:focus-visible{outline:none}

  /* ============ CARTA EN PAPEL ============ */
  .panel{
    position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    padding:clamp(16px,4vw,32px);
    background:rgba(12,5,10,.78);backdrop-filter:blur(8px);
    opacity:0;pointer-events:none;transition:opacity .5s ease;
  }
  .panel.abierto{opacity:1;pointer-events:auto}
  .hoja{
    position:relative;width:min(540px,100%);max-height:88vh;overflow-y:auto;
    background:
      radial-gradient(120% 60% at 20% 0%, #fffaf8 0%, transparent 60%),
      linear-gradient(175deg, #fdf4f1 0%, #f7e7ec 100%);
    color:var(--tinta);
    padding:clamp(30px,6vw,46px) clamp(24px,5vw,44px) clamp(30px,5vw,40px);
    box-shadow:0 34px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(201,42,110,.14);
    transform:translateY(20px) scale(.97) rotate(-.35deg);
    transition:transform .6s cubic-bezier(.16,.84,.34,1);
  }
  .panel.abierto .hoja{transform:rotate(-.35deg)}
  .hoja::before{ /* cinta de washi rosa */
    content:"";position:absolute;top:-11px;left:50%;width:108px;height:24px;
    transform:translateX(-50%) rotate(-2.2deg);
    background:repeating-linear-gradient(115deg, rgba(255,140,190,.62) 0 7px, rgba(255,180,212,.62) 7px 14px);
    box-shadow:0 2px 6px rgba(0,0,0,.14);
  }
  .sello{
    display:block;font-family:var(--t-util);font-size:.52rem;font-weight:400;
    letter-spacing:.36em;text-transform:uppercase;color:var(--rosa-hondo);
    text-align:center;margin:0 0 6px;
  }
  .hoja h2{
    font-family:var(--t-display);font-weight:400;
    font-size:clamp(1.6rem,6.4vw,2.35rem);line-height:1.12;
    margin:10px 0 0;text-align:center;text-wrap:balance;color:#2f1522;
  }
  .filigrana{
    display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 0 26px;
    color:var(--rosa-hondo);opacity:.6;
  }
  .filigrana span{height:1px;width:52px;background:currentColor}

  .galeria{margin:0 0 28px}
  .tira{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(62px,1fr));
    gap:7px;margin-top:22px;
  }
  .mini{
    padding:0;border:0;background:#fff;cursor:pointer;display:block;
    box-shadow:0 3px 10px rgba(59,28,43,.18);
    transition:transform .3s cubic-bezier(.2,.7,.3,1), box-shadow .3s ease;
  }
  .mini img{
    display:block;width:100%;aspect-ratio:1/1;object-fit:cover;
    opacity:.62;transition:opacity .3s ease;
  }
  .mini:hover img,.mini:focus-visible img{opacity:1}
  .mini:hover{transform:translateY(-2px)}
  .mini.activa{box-shadow:0 0 0 2px var(--rosa-hondo), 0 6px 14px rgba(59,28,43,.24)}
  .mini.activa img{opacity:1}
  .mini:focus-visible{outline:2px solid var(--rosa-hondo);outline-offset:2px}
  .cuenta-fotos{
    font-family:var(--t-util);font-size:.52rem;font-weight:400;letter-spacing:.26em;
    text-transform:uppercase;color:var(--tinta-suave);text-align:center;margin:14px 0 0;
  }
  .impresion{
    position:relative;width:min(248px,68%);margin:0 auto;
    background:#fff;padding:11px 11px 42px;
    box-shadow:0 14px 30px rgba(59,28,43,.22);
    transform:rotate(1.4deg);
  }
  .impresion::before{ /* cinta de la foto */
    content:"";position:absolute;top:-9px;left:50%;width:62px;height:19px;
    transform:translateX(-50%) rotate(-3deg);
    background:rgba(255,160,200,.55);
  }
  .impresion .hueco{
    aspect-ratio:4/5;max-width:100%;
    background:repeating-linear-gradient(45deg,#f7e3ec 0 9px,#f0d4e1 9px 18px);
    display:flex;align-items:center;justify-content:center;padding:12px;
    font-family:var(--t-util);font-size:.55rem;font-weight:400;letter-spacing:.2em;
    text-transform:uppercase;text-align:center;color:#a8768d;
  }
  .impresion img{aspect-ratio:4/5;width:100%;object-fit:cover;display:block}
  .impresion figcaption{
    position:absolute;left:0;right:0;bottom:11px;text-align:center;
    font-family:var(--t-mano);font-size:1.35rem;color:#6b3350;line-height:1;
  }

  .cuerpo{
    font-family:var(--t-display);font-size:clamp(1.02rem,3.6vw,1.14rem);
    line-height:1.78;max-width:40ch;margin:0 auto;color:#4a2436;text-align:left;
  }
  .cuerpo p+p{margin-top:15px}
  .cuerpo p:first-child::first-letter{
    font-size:2.9em;line-height:.82;float:left;padding:6px 10px 0 0;
    color:var(--rosa-hondo);font-weight:400;
  }
  .cuerpo em{font-style:italic;color:var(--rosa-hondo)}
  .rubrica{
    font-family:var(--t-mano);font-size:1.85rem;color:var(--rosa-hondo);
    text-align:right;margin-top:24px!important;
  }
  .rubrica::first-letter{font-size:1em;float:none;padding:0;color:inherit}

  .cerrar{
    display:block;margin:30px auto 0;background:none;cursor:pointer;
    border:1px solid rgba(201,42,110,.32);border-radius:999px;
    font-family:var(--t-util);font-size:.55rem;font-weight:400;
    letter-spacing:.3em;text-transform:uppercase;color:var(--rosa-hondo);
    padding:12px 26px;transition:background .3s ease;
  }
  .cerrar:hover{background:rgba(201,42,110,.08)}

  @media (max-width:520px){
    .cabecera{flex-direction:column;align-items:center;gap:10px}
    .ocasion{max-width:none;text-align:center;line-height:1.8}
    .titulo{text-align:center}
    .titulo .apellido{padding-right:0}
    .pista{font-size:.48rem;letter-spacing:.2em}
  }
  @media (prefers-reduced-motion:reduce){
    .velo .para,.velo .firma-nombre,.velo .sub,.abrir{animation:none;opacity:1}
    .hoja,.panel,.hud,.etiqueta{transition:none}
  }
</style>
</head>
<body>

<canvas id="cosmos"></canvas>
<div class="atmosfera" aria-hidden="true"></div>
<div class="grano" aria-hidden="true"></div>
<div class="scrim arriba" aria-hidden="true"></div>
<div class="scrim abajo" aria-hidden="true"></div>

<!-- ============ OBERTURA ============ -->
<section class="velo" id="velo">
  <p class="para">Para mi esposa</p>
  <h1 class="firma-nombre">Vania Valeria</h1>
  <p class="sub">Me tomó dos años encontrarte.<br>Hoy llevamos cien días.<br>Te hice un universo, y es rosado.</p>
  <button class="abrir" id="btn-abrir" type="button">Ábrelo</button>
</section>

<!-- ============ HUD ============ -->
<div class="hud" id="hud">
  <header class="cabecera">
    <p class="ocasion">21 · IX Día de las flores</p>
    <div class="titulo">
      <p class="nombre">Vania Valeria</p>
      <p class="apellido">Nina Chunga</p>
    </div>
  </header>

  <div></div>

  <footer class="pie-hud">
    <section class="cifras" aria-label="Nuestros números">
      <div class="cifra-bloque">
        <span class="cifra" id="c-juntos">100</span>
        <span class="filete" aria-hidden="true"></span>
        <span class="etiqueta-cifra">Días juntos</span>
      </div>
      <span class="rombo" aria-hidden="true"></span>
      <div class="cifra-bloque">
        <span class="cifra" id="c-casados">17</span>
        <span class="filete" aria-hidden="true"></span>
        <span class="etiqueta-cifra">Días casados</span>
      </div>
    </section>

    <ul class="indice" id="indice" aria-label="Nuestras etapas"></ul>

    <button class="carta-cta" id="btn-carta" type="button">lo que te quería decir</button>
    <p class="pista"><b>Gira</b> el universo · <b>abre</b> las diez flores</p>
  </footer>
</div>

<!-- ============ CARTA ============ -->
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="p-titulo">
  <article class="hoja">
    <p class="sello" id="p-fecha"></p>
    <h2 id="p-titulo"></h2>
    <p class="filigrana" aria-hidden="true"><span></span>✿<span></span></p>
    <div class="galeria" id="p-galeria"></div>
    <div class="cuerpo" id="p-texto"></div>
    <button class="cerrar" id="p-cerrar" type="button">volver al universo</button>
  </article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

    g7:["fotos/g7/01.jpg","fotos/g7/02.jpg","fotos/g7/03.jpg","fotos/g7/04.jpg","fotos/g7/05.jpg","fotos/g7/06.jpg","fotos/g7/07.jpg","fotos/g7/08.jpg","fotos/g7/09.jpg","fotos/g7/10.jpg","fotos/g7/11.jpg","fotos/g7/12.jpg"],

      titulo:"Te conocí en el curso de finanzas",
      pieFoto:"antes de todo",
      texto:"<p>Yo estaba ahí por el curso y nada más. Y de pronto estabas tú.</p><p>Ese día salí pensando en ti y me pareció una tontería, porque apenas te había visto. Nunca me imaginé que iba a terminar casándome contigo.</p>",

  /* --- pétalo paramétrico --- */
  function geometriaPetalo(largo, ancho, caida, acopado, giro){
    var NU = 16, NV = 9, verts = [], nors = [], uvs = [], idx = [];
    function punto(u, v){
      var perfil = Math.pow(Math.sin(Math.PI * Math.pow(u, 0.62)), 0.85);
      var an = ancho * perfil * (1 - 0.18*u);
      var tw = giro * u, x = v * an, z = u * largo;
      var y = -caida * u * u - acopado * (v*v) * perfil;
      return [x*Math.cos(tw) - y*Math.sin(tw), x*Math.sin(tw) + y*Math.cos(tw), z];
    }
    for(var i=0;i<=NU;i++){
      for(var j=0;j<=NV;j++){
        var u = i/NU, v = (j/NV)*2 - 1, p = punto(u, v);
        verts.push(p[0], p[1], p[2]);
        var pu = punto(Math.min(1,u+0.01), v), pv = punto(u, Math.min(1,v+0.02));
        var a = [pu[0]-p[0], pu[1]-p[1], pu[2]-p[2]], b = [pv[0]-p[0], pv[1]-p[1], pv[2]-p[2]];
        var n = [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
        var L = Math.hypot(n[0],n[1],n[2]) || 1;
        nors.push(n[0]/L, n[1]/L, n[2]/L);
        uvs.push((v+1)/2, u);
      }
    }
    for(var i2=0;i2<NU;i2++) for(var j2=0;j2<NV;j2++){
      var a1 = i2*(NV+1)+j2, b1 = a1+1, c1 = a1+(NV+1), d1 = c1+1;
      idx.push(a1,c1,b1, b1,c1,d1);
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nors,3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
    g.setIndex(idx); return g;
  }

  function texturaPetalo(){
    var c = document.createElement('canvas'); c.width = 128; c.height = 256;
    var g = c.getContext('2d');

    grad.addColorStop(1,   '#fff6fa');
    g.fillStyle = grad; g.fillRect(0,0,128,256);
    g.strokeStyle = 'rgba(140,20,72,.18)';
    for(var i=0;i<11;i++){
      g.lineWidth = i===5 ? 2.2 : 1;
      g.beginPath(); g.moveTo(64,256);
      g.quadraticCurveTo(64 + (i-5)*7, 130, 64 + (i-5)*13, 6); g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,.07)';
    for(var k=0;k<260;k++) g.fillRect(Math.random()*128, Math.random()*256, 1, 1+Math.random()*3);
    var t = new THREE.CanvasTexture(c);
    if(THREE.sRGBEncoding) t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 4; return t;
  }

  /* une varias geometrías ya colocadas en una sola */
  function fusionar(geos){
    var np = 0, ni = 0, i;
    for(i=0;i<geos.length;i++){
      np += geos[i].attributes.position.count;
      ni += geos[i].index.count;
    }
    var P = new Float32Array(np*3), N = new Float32Array(np*3), U = new Float32Array(np*2);
    var I = (np > 65535) ? new Uint32Array(ni) : new Uint16Array(ni);
    var op = 0, ou = 0, oi = 0, base = 0;
    for(i=0;i<geos.length;i++){
      var g = geos[i];
      P.set(g.attributes.position.array, op);
      N.set(g.attributes.normal.array, op);
      U.set(g.attributes.uv.array, ou);
      var idx = g.index.array;
      for(var k=0;k<idx.length;k++) I[oi+k] = idx[k] + base;
      base += g.attributes.position.count;
      op += g.attributes.position.array.length;
      ou += g.attributes.uv.array.length;
      oi += idx.length;
    }
    var out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(P,3));
    out.setAttribute('normal', new THREE.BufferAttribute(N,3));
    out.setAttribute('uv', new THREE.BufferAttribute(U,2));
    out.setIndex(new THREE.BufferAttribute(I,1));
    return out;
  }

  function hazFlor(color, escala){
    var g = new THREE.Group();
    var tinte = new THREE.Color(color);
    var matPetalo = new THREE.MeshStandardMaterial({
      map: mapaPetalo, color: tinte, roughness:.58, metalness:0,
      side:THREE.DoubleSide, emissive: tinte.clone().multiplyScalar(.10)
    });
    g.userData.matPetalo = matPetalo;
    g.userData.tinte = tinte;

    /* Los 35 pétalos se funden en una sola malla: el mismo detalle,
       una sola llamada de dibujo, para que vuele en el celular. */
    var piezas = [], eu = new THREE.Euler(), mat4 = new THREE.Matrix4();
    var qq = new THREE.Quaternion(), vv = new THREE.Vector3(), ss = new THREE.Vector3();
    CAPAS.forEach(function(capa, ci){
      for(var k=0;k<capa.n;k++){
        var jit = (Math.sin(k*12.9898 + ci*78.233) * 43758.5453) % 1;
        jit = jit - Math.floor(jit);
        eu.set(capa.incl + (jit-0.5)*0.18,
               (k/capa.n)*Math.PI*2 + ci*0.42 + (jit-0.5)*0.12,
               (jit-0.5)*0.22, 'YXZ');
        qq.setFromEuler(eu);
        vv.set(0, -ci*0.045, 0);
        var e = capa.s * (0.9 + jit*0.2);
        ss.set(e, e, e);
        mat4.compose(vv, qq, ss);
        piezas.push(geoCapas[ci].clone().applyMatrix4(mat4));
      }
    });
    g.add(new THREE.Mesh(fusionar(piezas), matPetalo));

    var NF = 150, phi = Math.PI * (3 - Math.sqrt(5));
    var disco = new THREE.InstancedMesh(geoFloreta, matFloreta, NF);
    var m = new THREE.Matrix4(), q = new THREE.Quaternion();
    var v = new THREE.Vector3(), esc = new THREE.Vector3();
    var cFuera = new THREE.Color(0x7d5116), cDentro = new THREE.Color(0x4a2d08), cc = new THREE.Color();
    for(var f=0; f<NF; f++){
      var tt = f/NF, rr = 0.62*Math.sqrt(tt), aa = f*phi;
      v.set(Math.cos(aa)*rr, 0.13*(1 - tt*tt), Math.sin(aa)*rr);
      var r0 = 0.055 + tt*0.045;
      esc.set(r0, r0*0.72, r0);
      m.compose(v, q, esc); disco.setMatrixAt(f, m);
      cc.copy(cDentro).lerp(cFuera, Math.pow(tt,.7)); disco.setColorAt(f, cc);
    }
    disco.rotation.x = -Math.PI/2;
    disco.instanceMatrix.needsUpdate = true;
    if(disco.instanceColor) disco.instanceColor.needsUpdate = true;
    g.add(disco);

    var cojin = new THREE.Mesh(
      new THREE.SphereGeometry(0.60, 24, 16, 0, Math.PI*2, 0, Math.PI/2),
      new THREE.MeshStandardMaterial({color:0x5a3a0c, roughness:.95})
    );
    cojin.scale.y = 0.34; cojin.rotation.x = -Math.PI/2; cojin.position.y = -0.02;
    g.add(cojin);

    var sep = [];
    for(var sp=0; sp<10; sp++){
      eu.set(-0.5, (sp/10)*Math.PI*2 + 0.2, 0, 'YXZ');
      qq.setFromEuler(eu); vv.set(0,-0.12,0); ss.set(1,1,1);
      mat4.compose(vv, qq, ss);
      sep.push(geoSepalo.clone().applyMatrix4(mat4));
    }
    g.add(new THREE.Mesh(fusionar(sep), matSepalo));

    var tallo = new THREE.Mesh(geoTallo, matTallo);
    tallo.position.y = -1.55; tallo.rotation.z = 0.05; g.add(tallo);

    [0,1].forEach(function(li){
      var h = new THREE.Mesh(geoHoja, matHoja);
      h.rotation.order = 'YXZ';
      h.position.set(0, -1.15 - li*0.62, 0);
      h.rotation.y = li ? Math.PI*0.82 : Math.PI*0.12;
      h.rotation.x = -0.35 - li*0.2;
      h.scale.setScalar(0.95 - li*0.12);
      g.add(h);
    });

    g.scale.setScalar(escala);
    return g;
  }

  var heroes = [];
  ETAPAS.forEach(function(e, idx){
    var cont = new THREE.Group();
    var flor = hazFlor(e.color, 1.9 * e.escala);
    cont.add(flor);
    cont.add(new THREE.PointLight(e.color, 1.4, 26));
    var golpe = new THREE.Mesh(new THREE.SphereGeometry(4.4*e.escala, 10, 8), new THREE.MeshBasicMaterial({visible:false}));
    golpe.userData.idx = idx; cont.add(golpe);
    mundo.add(cont);

    var btn = document.createElement('button');
    btn.className = 'etiqueta'; btn.type = 'button';
    btn.innerHTML = e.etiqueta + '<span class="anio">' + e.anio + '</span>';
    btn.addEventListener('click', function(ev){ ultimoFoco = ev.currentTarget; abrir(e, idx); });
    document.body.appendChild(btn);

    heroes.push({
      cont:cont, flor:flor, golpe:golpe, btn:btn, datos:e, idx:idx,
      ang: idx*(Math.PI*2/ETAPAS.length) + 0.4,
      vel: 0.055/(0.6 + idx*0.28),
      radio:e.radio, altura:e.altura, base:1.9*e.escala, brillo:0
    });
  });

  var sueltos = new THREE.Group();
  var matSuelto = new THREE.MeshStandardMaterial({
    map:mapaPetalo, color:0xffc2de, roughness:.6, side:THREE.DoubleSide,
    transparent:true, opacity:.9, emissive:0x3a0a1e
  });
  var geoSuelto = geometriaPetalo(1.0, 0.24, 0.3, 0.3, 0.5);
  geoSuelto.translate(0, 0, -0.5);
  for(var s=0;s<(esPhone?26:48);s++){
    var pet = new THREE.Mesh(geoSuelto, matSuelto);
    pet.position.set((Math.random()-.5)*54, (Math.random()-.5)*34, (Math.random()-.5)*54);
    pet.userData.giro = (Math.random()-.5)*0.02;
    pet.userData.sube = 0.02 + Math.random()*0.05;
    sueltos.add(pet);
  }
  mundo.add(sueltos);

  /* ===================== CÁMARA ===================== */
  var destino = esPhone ? 112 : 88;
  var obj = { yaw:0.6, pitch:0.38, dist:230 };
  var act = { yaw:obj.yaw, pitch:1.05, dist:260 };
  var arrastrando = false, ultX = 0, ultY = 0, movido = false, ultimoToque = 0;
  var punteros = {}, pellizco = 0, abierto = false;

  function abajo(e){
    if(!abierto) return;
    punteros[e.pointerId] = {x:e.clientX, y:e.clientY};
    arrastrando = true; movido = false;
    ultX = e.clientX; ultY = e.clientY;
    cv.classList.add('arrastrando');
    if(cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
  }
  function mueve(e){
    puntero.x = (e.clientX / window.innerWidth)*2 - 1;
    puntero.y = -(e.clientY / window.innerHeight)*2 + 1;
    hayPuntero = true;
    if(punteros[e.pointerId]) punteros[e.pointerId] = {x:e.clientX, y:e.clientY};
    var ids = Object.keys(punteros);
    if(ids.length >= 2){
      var a = punteros[ids[0]], b = punteros[ids[1]];
      var d = Math.hypot(a.x-b.x, a.y-b.y);
      if(pellizco) obj.dist = Math.max(22, Math.min(220, obj.dist*(pellizco/d)));
      pellizco = d; return;
    }
    if(!arrastrando) return;
    var dx = e.clientX - ultX, dy = e.clientY - ultY;
    if(Math.abs(dx) + Math.abs(dy) > 4) movido = true;
    obj.yaw -= dx*0.005;
    obj.pitch = Math.max(-1.1, Math.min(1.1, obj.pitch + dy*0.004));
    ultX = e.clientX; ultY = e.clientY;
  }
  function arriba(e){
    delete punteros[e.pointerId];
    if(Object.keys(punteros).length < 2) pellizco = 0;
    arrastrando = false;
    cv.classList.remove('arrastrando');
    if(!movido && abierto) clic(e);
    ultimoToque = performance.now();
  }
  cv.addEventListener('pointerdown', abajo);
  window.addEventListener('pointermove', mueve);
  cv.addEventListener('pointerup', arriba);
  cv.addEventListener('pointercancel', arriba);
  cv.addEventListener('wheel', function(e){
    if(!abierto) return;
    e.preventDefault();
    obj.dist = Math.max(22, Math.min(220, obj.dist + e.deltaY*0.07));
  }, {passive:false});

  var rayo = new THREE.Raycaster(), puntero = new THREE.Vector2(), hayPuntero = false;
  function clic(e){
    var r = cv.getBoundingClientRect();
    puntero.x = ((e.clientX - r.left)/r.width)*2 - 1;
    puntero.y = -((e.clientY - r.top)/r.height)*2 + 1;
    rayo.setFromCamera(puntero, camara);
    var golpes = rayo.intersectObjects(heroes.map(function(h){return h.golpe;}), false);
    if(golpes.length){
      var h = heroes[golpes[0].object.userData.idx];
      ultimoFoco = h.btn; abrir(h.datos, h.idx);
    }
  }

  /* ===================== OBERTURA ===================== */
  var velo = document.getElementById('velo');
  document.getElementById('btn-abrir').addEventListener('click', function(){
    velo.classList.add('fuera');
    abierto = true;
    obj.dist = destino;
    document.getElementById('hud').classList.add('dentro');
    pinta('c-juntos', dias(INICIO), 900);
    pinta('c-casados', dias(BODA), 1250);
    ultimoToque = performance.now() - 4000;
    setTimeout(function(){ velo.style.display = 'none'; }, 1300);
  });

  /* ===================== BUCLE ===================== */
  var vTmp = new THREE.Vector3(), dirTmp = new THREE.Vector3();
  var t0 = performance.now();

  function medidas(){
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camara.aspect = w/h; camara.updateProjectionMatrix();
    esPhone = w < 620;
    destino = esPhone ? 112 : 88;
  }
  window.addEventListener('resize', medidas);
  medidas();

  function bucle(ahora){
    var t = (ahora - t0)/1000;
    var dt = Math.min(0.05, (ahora - (bucle.prev || ahora))/1000);
    bucle.prev = ahora;

    if(abierto && !arrastrando && !reduce && ahora - ultimoToque > 2600) obj.yaw += dt*0.045;

    var suave = abierto ? 0.045 : 0.02;
    act.yaw   += (obj.yaw   - act.yaw)   * (arrastrando ? 0.12 : suave*2);
    act.pitch += (obj.pitch - act.pitch) * suave;
    act.dist  += (obj.dist  - act.dist)  * suave;

    var cp = Math.cos(act.pitch);
    camara.position.set(Math.sin(act.yaw)*cp*act.dist, Math.sin(act.pitch)*act.dist, Math.cos(act.yaw)*cp*act.dist);
    camara.lookAt(0,0,0);

    solcito.position.copy(camara.position).multiplyScalar(0.35);
    matPolvo.uniforms.tiempo.value = t;
    nucleo.scale.setScalar(1 + Math.sin(t*1.7)*0.06);
    halo.scale.setScalar(1 + Math.sin(t*1.1)*0.09);

    sueltos.children.forEach(function(p){
      p.rotation.z += p.userData.giro;
      p.rotation.x += p.userData.giro*0.6;
      p.rotation.y += p.userData.giro*0.4;
      p.position.y += p.userData.sube;
      if(p.position.y > 20) p.position.y = -20;
    });

    /* qué flor está bajo el cursor */
    var encima = -1;
    if(abierto && hayPuntero && !arrastrando){
      rayo.setFromCamera(puntero, camara);
      var gg = rayo.intersectObjects(heroes.map(function(h){return h.golpe;}), false);
      if(gg.length) encima = gg[0].object.userData.idx;
    }
    cv.classList.toggle('sobre-flor', encima >= 0);

    camara.getWorldDirection(dirTmp);
    var w = window.innerWidth, h = window.innerHeight;

    heroes.forEach(function(hx){
      if(!reduce) hx.ang += dt*hx.vel;
      hx.cont.position.set(Math.cos(hx.ang)*hx.radio, hx.altura + Math.sin(t*0.7 + hx.ang)*0.9, Math.sin(hx.ang)*hx.radio);
      hx.flor.rotation.y += dt*0.5;
      hx.flor.rotation.x = Math.sin(t*0.6 + hx.ang)*0.22;

      var meta = encima === hx.idx ? 1 : 0;
      hx.brillo += (meta - hx.brillo)*0.12;
      hx.flor.scale.setScalar(hx.base * (1 + hx.brillo*0.09));
      var mp = hx.flor.userData.matPetalo;
      if(mp) mp.emissive.copy(hx.flor.userData.tinte).multiplyScalar(0.10 + hx.brillo*0.22);

      vTmp.copy(hx.cont.position);
      mundo.localToWorld(vTmp);
      var delante = vTmp.clone().sub(camara.position).dot(dirTmp) > 0;
      vTmp.project(camara);
      hx.btn.style.left = ((vTmp.x*0.5+0.5)*w) + 'px';
      hx.btn.style.top  = ((-vTmp.y*0.5+0.5)*h - 62*hx.datos.escala) + 'px';
      var ver = delante && abierto;
      hx.btn.style.opacity = ver ? (0.42 + hx.brillo*0.58).toFixed(2) : '0';
      hx.btn.style.pointerEvents = ver ? 'auto' : 'none';
    });

    mundo.rotation.y += dt*0.006;
    renderer.render(escena, camara);
    requestAnimationFrame(bucle);
  }
  requestAnimationFrame(bucle);
})();
</script>
</body>
</html>
